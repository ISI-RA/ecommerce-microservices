version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:13-alpine
    container_name: ecommerce_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ecommerce}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/DATABASE_SCHEMA.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service (Python Flask)
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth_service
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-ecommerce}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_HOURS: 24
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ecommerce-network
    volumes:
      - ./auth-service:/app
    command: flask run --host=0.0.0.0

  # Products Service (Node.js Express)
  products-service:
    build:
      context: ./products-service
      dockerfile: Dockerfile
    container_name: products_service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-ecommerce}
      PORT: 3001
      AUTH_SERVICE_URL: http://auth-service:5000
      PAYMENT_SERVICE_URL: http://payment-service:8080
      JWT_SECRET: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - ecommerce-network
    volumes:
      - ./products-service:/app
      - /app/node_modules
    command: npm run dev

  # Payment Service (Java Spring Boot)
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment_service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-ecommerce}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      PRODUCTS_SERVICE_URL: http://products-service:3001
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-smtp.gmail.com}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-your-email@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-your-app-password}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ecommerce-network
    volumes:
      - ./payment-service:/app

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce_frontend
    environment:
      REACT_APP_API_URL: http://localhost:3001
      REACT_APP_AUTH_URL: http://localhost:5000
      REACT_APP_PAYMENT_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - products-service
      - auth-service
      - payment-service
    networks:
      - ecommerce-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  ecommerce-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
